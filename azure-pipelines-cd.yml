trigger: none

pr: none

resources:
  pipelines:
    - pipeline: ci
      source: 'azure-pipelines-ci'
      trigger:
        branches:
          include:
            - dev
            - main

variables:
  - name: appName
    value: 'qasco'

stages:
  # ==================================================
  # UAT DEPLOYMENT STAGE
  # ==================================================
  - stage: Deploy_UAT
    displayName: 'Deploy to UAT'
    condition: and(succeeded(), eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeployToUAT
        displayName: 'Deploy to UAT Windows Server'
        environment:
          name: uat
          resourceName: UAT_QASCO
          resourceType: VirtualMachine
        variables:
          - group: 'qasco-uat-variables'
        strategy:
          runOnce:
            deploy:
              steps:

                # ==================================================
                # UAT Agent diagnostics
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify Target Machine'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "========================================"
                      Write-Host "UAT Agent Diagnostics"
                      Write-Host "========================================"

                      Write-Host "Agent OS: $(Agent.OS)"
                      Write-Host "Agent Name: $(Agent.Name)"
                      Write-Host "Computer Name:"
                      hostname

                      Write-Host ""
                      Write-Host "PowerShell:"
                      $PSVersionTable

                      Write-Host ""
                      Write-Host "Node:"
                      node --version

                      Write-Host ""
                      Write-Host "NPM:"
                      npm --version

                      Write-Host ""
                      Write-Host "PM2:"
                      pm2 --version

                # ==================================================
                # Clean old download artifacts
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Clean old CI artifacts'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      $DropPath = "$(Pipeline.Workspace)\ci\drop"

                      Write-Host "========================================"
                      Write-Host "CLEAN OLD CI ARTIFACTS"
                      Write-Host "========================================"
                      Write-Host "Artifact directory: $DropPath"

                      if (Test-Path $DropPath) {
                        Write-Host "Existing files:"
                        Get-ChildItem $DropPath -File | ForEach-Object {
                          Write-Host "  $($_.Name)"
                        }

                        Write-Host ""
                        Write-Host "Removing old ZIP files..."

                        Get-ChildItem $DropPath -Filter "*.zip" -File |
                          Remove-Item -Force

                        Write-Host "Old ZIP files removed."
                      }
                      else {
                        Write-Host "Drop directory does not exist. Creating it..."
                        New-Item -ItemType Directory -Path $DropPath -Force | Out-Null
                      }

                      Write-Host ""
                      Write-Host "Remaining files:"
                      Get-ChildItem $DropPath -File -ErrorAction SilentlyContinue |
                        ForEach-Object {
                          Write-Host "  $($_.Name)"
                        }

                # ==================================================
                # Download artifacts
                # ==================================================
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download build artifact'
                  inputs:
                    buildType: 'specific'
                    project: '$(System.TeamProjectId)'
                    definition: '$(resources.pipeline.ci.pipelineID)'
                    buildVersionToDownload: 'specific'
                    pipelineId: '$(resources.pipeline.ci.runID)'
                    artifactName: 'drop'
                    targetPath: '$(Pipeline.Workspace)\ci\drop'

                # ==================================================
                # Extract artifacts
                # ==================================================
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/ci/drop/*.zip'
                    destinationFolder: '$(System.ArtifactsDirectory)/extracted'
                    cleanDestinationFolder: true
                    overwriteExistingFiles: true
                  displayName: 'Extract build artifact'

                # ==================================================
                # Stop existing application
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Stop existing PM2 application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Continue'

                      # Configuration
                      $AppName = '$(appName)'
                      $Environment = 'uat'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "STOP PM2 APPLICATION"
                      Write-Host "========================================"
                      Write-Host "PM2 Name: $Pm2AppName"

                      Write-Host "Stopping existing PM2 application..."

                      # Check if PM2 app exists using a different approach
                      $pm2List = pm2 list
                      $appExists = $pm2List -match $Pm2AppName

                      if ($appExists) {
                        Write-Host "Found existing PM2 application '$Pm2AppName'. Deleting..."
                        pm2 delete $Pm2AppName
                        Write-Host "PM2 application deleted."
                      } else {
                        Write-Host "PM2 application '$Pm2AppName' does not exist. Nothing to stop."
                      }

                      exit 0

                # ==================================================
                # Cleaning & Copy application files
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Clean & Copy application files'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $SourcePath = "$(System.ArtifactsDirectory)/extracted"
                      $AppPath = Join-Path $DeploymentPath $AppName

                      Write-Host "========================================"
                      Write-Host "CLEAN & COPY FILES"
                      Write-Host "========================================"
                      Write-Host "Source: $SourcePath"
                      Write-Host "Destination: $AppPath"

                      # Validate source
                      if (-not (Test-Path $SourcePath)) {
                        throw "Source path does not exist: $SourcePath"
                      }

                      # Clean destination
                      Write-Host "Cleaning existing application directory..."
                      if (Test-Path $AppPath) {
                        Remove-Item -Path $AppPath -Recurse -Force
                        Write-Host "Removed existing directory: $AppPath"
                      }

                      # Create destination
                      New-Item -ItemType Directory -Path $AppPath -Force | Out-Null
                      Write-Host "Created directory: $AppPath"

                      # Copy files
                      Write-Host "Copying application files..."
                      Copy-Item -Path "$SourcePath/*" -Destination $AppPath -Recurse -Force
                      Write-Host "Files copied successfully."

                      # Validate package.json existence
                      if (-not (Test-Path "$AppPath\package.json")) {
                        throw "package.json not found at $AppPath"
                      }

                      # Validate web.config existence
                      if (-not (Test-Path "$AppPath\web.config")) {
                        throw "web.config not found at $AppPath"
                      }
                      Write-Host "web.config found at $AppPath\web.config"

                # ==================================================
                # Setup .env file
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Setup environment variables (.env)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'uat'
                      $Port = '$(Port)'

                      Write-Host "========================================"
                      Write-Host "SETUP ENVIRONMENT"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "Environment: $Environment"
                      Write-Host "Port: $Port"

                      # Validate .env.template existence
                      if (-not (Test-Path "$AppPath\.env.template")) {
                        throw ".env.template not found at $AppPath"
                      }

                      # Create .env
                      Write-Host "Creating .env file..."
                      $envFile = Join-Path $AppPath ".env"
                      Copy-Item "$AppPath\.env.template" $envFile -Force

                      Add-Content $envFile ""
                      Add-Content $envFile "# $Environment Environment Variables"
                      Add-Content $envFile "DATABASE_URL=$env:DATABASE_URL"
                      Add-Content $envFile "DB_HOST=$env:DB_HOST"
                      Add-Content $envFile "DB_NAME=$env:DB_NAME"
                      Add-Content $envFile "DB_PASSWORD=$env:DB_PASSWORD"
                      Add-Content $envFile "DB_PORT=$env:DB_PORT"
                      Add-Content $envFile "DB_USER=$env:DB_USER"
                      Add-Content $envFile "FILE_SERVER_PATH=$env:FILE_SERVER_PATH"
                      Add-Content $envFile "NEXTAUTH_SECRET=$env:NEXTAUTH_SECRET"
                      Add-Content $envFile "NEXTAUTH_URL=$env:NEXTAUTH_URL"
                      Add-Content $envFile "PORT=$Port"
                      Add-Content $envFile "APP_ENVIRONMENT=$Environment"

                      Write-Host ".env file created at $envFile"
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                    DB_HOST: $(DB_HOST)
                    DB_NAME: $(DB_NAME)
                    DB_PASSWORD: $(DB_PASSWORD)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    FILE_SERVER_PATH: $(FILE_SERVER_PATH)
                    NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
                    NEXTAUTH_URL: $(NEXTAUTH_URL)

                # ==================================================
                # Setup PM2 ecosystem config
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Setup PM2 ecosystem configuration'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'uat'
                      $Port = '$(Port)'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "SETUP PM2 ECOSYSTEM"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "PM2 App Name: $Pm2AppName"

                      # Create logs directory
                      $LogsPath = Join-Path $AppPath "logs"
                      New-Item -ItemType Directory -Path $LogsPath -Force | Out-Null
                      Write-Host "Logs directory created: $LogsPath"

                      # Create ecosystem config
                      Write-Host "Creating ecosystem.config.js..."

                      $Pm2LogPath = $AppPath -replace '\\', '/'

                      $config = @"
                        module.exports = {
                          apps: [{
                          name: '$Pm2AppName',
                          script: 'server.js',
                          env_${Environment}: {
                            NODE_ENV: 'production',
                            PORT: $Port,
                            DATABASE_URL:'$env:DATABASE_URL',
                            DB_HOST:'$env:DB_HOST',
                            DB_NAME:'$env:DB_NAME',
                            DB_PASSWORD:'$env:DB_PASSWORD',
                            DB_PORT:$env:DB_PORT,
                            DB_USER:'$env:DB_USER',
                            FILE_SERVER_PATH:'$env:FILE_SERVER_PATH',
                            NEXTAUTH_SECRET:'$env:NEXTAUTH_SECRET',
                            NEXTAUTH_URL:'$env:NEXTAUTH_URL',
                            APP_ENVIRONMENT:'$Environment',
                          },
                          watch: false,
                          autorestart: true,
                          max_memory_restart: '1G',
                          error_file: '$Pm2LogPath/logs/pm2-error.log',
                          out_file: '$Pm2LogPath/logs/pm2-out.log',
                          instances: '1',
                          exec_mode: 'fork'
                          }]
                        }
                      "@

                      Set-Content -Path "$AppPath\ecosystem.config.js" -Value $config -Encoding UTF8
                      Write-Host "ecosystem.config.js created."
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                    DB_HOST: $(DB_HOST)
                    DB_NAME: $(DB_NAME)
                    DB_PASSWORD: $(DB_PASSWORD)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    FILE_SERVER_PATH: $(FILE_SERVER_PATH)
                    NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
                    NEXTAUTH_URL: $(NEXTAUTH_URL)

                # ==================================================
                # Start PM2 application
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Start PM2 application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'uat'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "START PM2 APPLICATION"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "PM2 App Name: $Pm2AppName"
                      Write-Host "Environment: $Environment"

                      # Move to app directory
                      Set-Location $AppPath

                      # Start PM2
                      Write-Host "Starting PM2 application..."
                      pm2 start ecosystem.config.js --env $Environment

                      if ($LASTEXITCODE -ne 0) {
                        throw "PM2 start failed with exit code $LASTEXITCODE"
                      }

                      Write-Host "Saving PM2 process list..."
                      pm2 save

                      Write-Host "PM2 status:"
                      pm2 list

                # ==================================================
                # Health Check
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify UAT deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      $Port = $(Port)
                      $maxAttempts = 12
                      $attempt = 1
                      $success = $false

                      Write-Host "========================================"
                      Write-Host "UAT HEALTH CHECK"
                      Write-Host "========================================"

                      Write-Host "Server: $env:COMPUTERNAME"
                      Write-Host "Port: $Port"

                      while ($attempt -le $maxAttempts -and -not $success) {
                        try {
                          Write-Host "Health check attempt $attempt/$maxAttempts..."

                          $response = Invoke-WebRequest -Uri "http://localhost:$Port/api/health" -UseBasicParsing -TimeoutSec 10

                          if ($response.StatusCode -eq 200) {
                            Write-Host "Health check passed!"
                            Write-Host "Status: $($response.StatusCode)"

                            $success = $true
                          }
                        } catch {
                          Write-Host "Attempt $attempt failed:"
                          Write-Host $_.Exception.Message
                        }
                        if (-not $success) {
                          if ($attempt -lt $maxAttempts) {
                            Write-Host "Waiting 5 seconds..."
                            Start-Sleep -Seconds 5
                          }

                          $attempt++
                        }
                      }
                
                      if (-not $success) {
                        Write-Host ""
                        Write-Host "PM2 status:"
                        pm2 list

                        throw "UAT deployment health check failed."
                      }

                      Write-Host "========================================"
                      Write-Host "UAT HEALTH CHECK PASSED"
                      Write-Host "========================================"

  # **************************************************
  # ==================================================
  # PRODUCTION DEPLOYMENT STAGE
  # ==================================================
  # **************************************************
  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: []
    condition: and(succeeded(), eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production Windows Server'
        environment:
          name: production
          resourceName: PROD_QASCO
          resourceType: VirtualMachine
        variables:
          - group: 'qasco-prod-variables'
        strategy:
          runOnce:
            deploy:
              steps:
                # ==================================================
                # Production Agent diagnostics
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify Target Machine'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "========================================"
                      Write-Host "Production Agent Diagnostics"
                      Write-Host "========================================"

                      Write-Host "Agent OS: $(Agent.OS)"
                      Write-Host "Agent Name: $(Agent.Name)"
                      Write-Host "Computer Name:"
                      hostname

                      Write-Host ""
                      Write-Host "PowerShell:"
                      $PSVersionTable

                      Write-Host ""
                      Write-Host "Node:"
                      node --version

                      Write-Host ""
                      Write-Host "NPM:"
                      npm --version

                      Write-Host ""
                      Write-Host "PM2:"
                      pm2 --version

                # ==================================================
                # Clean old download artifacts
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Clean old CI artifacts'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      $DropPath = "$(Pipeline.Workspace)\ci\drop"

                      Write-Host "========================================"
                      Write-Host "CLEAN OLD CI ARTIFACTS"
                      Write-Host "========================================"
                      Write-Host "Artifact directory: $DropPath"

                      if (Test-Path $DropPath) {
                        Write-Host "Existing files:"
                        Get-ChildItem $DropPath -File | ForEach-Object {
                          Write-Host "  $($_.Name)"
                        }

                        Write-Host ""
                        Write-Host "Removing old ZIP files..."

                        Get-ChildItem $DropPath -Filter "*.zip" -File |
                          Remove-Item -Force

                        Write-Host "Old ZIP files removed."
                      }
                      else {
                        Write-Host "Drop directory does not exist. Creating it..."
                        New-Item -ItemType Directory -Path $DropPath -Force | Out-Null
                      }

                      Write-Host ""
                      Write-Host "Remaining files:"
                      Get-ChildItem $DropPath -File -ErrorAction SilentlyContinue |
                        ForEach-Object {
                          Write-Host "  $($_.Name)"
                        }

                # ==================================================
                # Download artifacts
                # ==================================================
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download build artifact'
                  inputs:
                    buildType: 'specific'
                    project: '$(System.TeamProjectId)'
                    definition: '$(resources.pipeline.ci.pipelineID)'
                    buildVersionToDownload: 'specific'
                    pipelineId: '$(resources.pipeline.ci.runID)'
                    artifactName: 'drop'
                    targetPath: '$(Pipeline.Workspace)\ci\drop'

                # ==================================================
                # Extract artifacts
                # ==================================================
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/ci/drop/*.zip'
                    destinationFolder: '$(System.ArtifactsDirectory)/extracted'
                    cleanDestinationFolder: true
                    overwriteExistingFiles: true
                  displayName: 'Extract build artifact'

                # ==================================================
                # Stop existing application
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Stop existing PM2 application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Continue'

                      # Configuration
                      $AppName = '$(appName)'
                      $Environment = 'prod'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "STOP PM2 APPLICATION"
                      Write-Host "========================================"
                      Write-Host "PM2 Name: $Pm2AppName"

                      Write-Host "Stopping existing PM2 application..."

                      # Check if PM2 app exists using a different approach
                      $pm2List = pm2 list
                      $appExists = $pm2List -match $Pm2AppName

                      if ($appExists) {
                        Write-Host "Found existing PM2 application '$Pm2AppName'. Deleting..."
                        pm2 delete $Pm2AppName
                        Write-Host "PM2 application deleted."
                      } else {
                        Write-Host "PM2 application '$Pm2AppName' does not exist. Nothing to stop."
                      }

                      exit 0

                # ==================================================
                # Cleaning / Creating application directory
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Clean & Copy application files'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $SourcePath = "$(System.ArtifactsDirectory)/extracted"
                      $AppPath = Join-Path $DeploymentPath $AppName

                      Write-Host "========================================"
                      Write-Host "CLEAN & COPY FILES"
                      Write-Host "========================================"
                      Write-Host "Source: $SourcePath"
                      Write-Host "Destination: $AppPath"

                      # Create backup before cleaning
                      if (Test-Path $AppPath) {
                        $BackupPath = "$AppPath\..\backups\$AppName-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
                        New-Item -ItemType Directory -Path $BackupPath -Force | Out-Null
                        Copy-Item -Path "$AppPath\*" -Destination $BackupPath -Recurse -Force
                        Write-Host "Backup created at: $BackupPath"
                      }

                      # Validate source
                      if (-not (Test-Path $SourcePath)) {
                        throw "Source path does not exist: $SourcePath"
                      }

                      # Clean destination
                      Write-Host "Cleaning existing application directory..."
                      if (Test-Path $AppPath) {
                        Remove-Item -Path $AppPath -Recurse -Force
                        Write-Host "Removed existing directory: $AppPath"
                      }

                      # Create destination
                      New-Item -ItemType Directory -Path $AppPath -Force | Out-Null
                      Write-Host "Created directory: $AppPath"

                      # Copy files
                      Write-Host "Copying application files..."
                      Copy-Item -Path "$SourcePath/*" -Destination $AppPath -Recurse -Force
                      Write-Host "Files copied successfully."

                      # Validate package.json existence
                      if (-not (Test-Path "$AppPath\package.json")) {
                        throw "package.json not found at $AppPath"
                      }

                      # Validate web.config existence
                      if (-not (Test-Path "$AppPath\web.config")) {
                        throw "web.config not found at $AppPath"
                      }
                      Write-Host "web.config found at $AppPath\web.config"

                # ==================================================
                # Setup .env file
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Setup environment variables (.env)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'prod'
                      $Port = '$(Port)'

                      Write-Host "========================================"
                      Write-Host "SETUP ENVIRONMENT"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "Environment: $Environment"
                      Write-Host "Port: $Port"

                      # Validate .env.template existence
                      if (-not (Test-Path "$AppPath\.env.template")) {
                        throw ".env.template not found at $AppPath"
                      }

                      # Create .env
                      Write-Host "Creating .env file..."
                      $envFile = Join-Path $AppPath ".env"
                      Copy-Item "$AppPath\.env.template" $envFile -Force

                      Add-Content $envFile ""
                      Add-Content $envFile "# $Environment Environment Variables"
                      Add-Content $envFile "DATABASE_URL=$env:DATABASE_URL"
                      Add-Content $envFile "DB_HOST=$env:DB_HOST"
                      Add-Content $envFile "DB_NAME=$env:DB_NAME"
                      Add-Content $envFile "DB_PASSWORD=$env:DB_PASSWORD"
                      Add-Content $envFile "DB_PORT=$env:DB_PORT"
                      Add-Content $envFile "DB_USER=$env:DB_USER"
                      Add-Content $envFile "FILE_SERVER_PATH=$env:FILE_SERVER_PATH"
                      Add-Content $envFile "NEXTAUTH_SECRET=$env:NEXTAUTH_SECRET"
                      Add-Content $envFile "NEXTAUTH_URL=$env:NEXTAUTH_URL"
                      Add-Content $envFile "PORT=$Port"
                      Add-Content $envFile "APP_ENVIRONMENT=$Environment"

                      Write-Host ".env file created at $envFile"
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                    DB_HOST: $(DB_HOST)
                    DB_NAME: $(DB_NAME)
                    DB_PASSWORD: $(DB_PASSWORD)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    FILE_SERVER_PATH: $(FILE_SERVER_PATH)
                    NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
                    NEXTAUTH_URL: $(NEXTAUTH_URL)

                # ==================================================
                # Setup PM2 ecosystem config
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Setup PM2 ecosystem configuration'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'prod'
                      $Port = '$(Port)'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "SETUP PM2 ECOSYSTEM"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "PM2 App Name: $Pm2AppName"

                      # Create logs directory
                      $LogsPath = Join-Path $AppPath "logs"
                      New-Item -ItemType Directory -Path $LogsPath -Force | Out-Null
                      Write-Host "Logs directory created: $LogsPath"

                      # Create ecosystem config
                      Write-Host "Creating ecosystem.config.js..."

                      $Pm2LogPath = $AppPath -replace '\\', '/'

                      $config = @"
                        module.exports = {
                          apps: [{
                          name: '$Pm2AppName',
                          script: 'server.js',
                          env_${Environment}: {
                            NODE_ENV: 'production',
                            PORT: $Port,
                            DATABASE_URL:'$env:DATABASE_URL',
                            DB_HOST:'$env:DB_HOST',
                            DB_NAME:'$env:DB_NAME',
                            DB_PASSWORD:'$env:DB_PASSWORD',
                            DB_PORT:$env:DB_PORT,
                            DB_USER:'$env:DB_USER',
                            FILE_SERVER_PATH:'$env:FILE_SERVER_PATH',
                            NEXTAUTH_SECRET:'$env:NEXTAUTH_SECRET',
                            NEXTAUTH_URL:'$env:NEXTAUTH_URL',
                            APP_ENVIRONMENT:'$Environment',
                          },
                          watch: false,
                          autorestart: true,
                          max_memory_restart: '1G',
                          error_file: '$Pm2LogPath/logs/pm2-error.log',
                          out_file: '$Pm2LogPath/logs/pm2-out.log',
                          #  instances: 'max',
                          #  exec_mode: 'cluster'
                          instances: '1',
                          exec_mode: 'fork'
                          }]
                        }
                      "@

                      Set-Content -Path "$AppPath\ecosystem.config.js" -Value $config -Encoding UTF8
                      Write-Host "ecosystem.config.js created."
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                    DB_HOST: $(DB_HOST)
                    DB_NAME: $(DB_NAME)
                    DB_PASSWORD: $(DB_PASSWORD)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    FILE_SERVER_PATH: $(FILE_SERVER_PATH)
                    NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
                    NEXTAUTH_URL: $(NEXTAUTH_URL)

                # ==================================================
                # Deploy Prisma migrations
                # ==================================================
                # - task: PowerShell@2
                #   inputs:
                #     targetType: 'inline'
                #     script: npm run db:deploy
                #   displayName: 'Deploy Prisma database migrations'

                # ==================================================
                # Start PM2 application
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Start PM2 application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # Configuration
                      $DeploymentPath = '$(DeploymentPath)'
                      $AppName = '$(appName)'
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Environment = 'prod'
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "START PM2 APPLICATION"
                      Write-Host "========================================"
                      Write-Host "AppPath: $AppPath"
                      Write-Host "PM2 App Name: $Pm2AppName"
                      Write-Host "Environment: $Environment"

                      # Move to app directory
                      Set-Location $AppPath

                      # Start PM2
                      Write-Host "Starting PM2 application..."
                      pm2 start ecosystem.config.js --env $Environment

                      if ($LASTEXITCODE -ne 0) {
                        throw "PM2 start failed with exit code $LASTEXITCODE"
                      }

                      Write-Host "Saving PM2 process list..."
                      pm2 save

                      Write-Host "PM2 status:"
                      pm2 list

                # ==================================================
                # Health Check
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify Production deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      $Port = $(Port)
                      $maxAttempts = 12
                      $attempt = 1
                      $success = $false

                      Write-Host "========================================"
                      Write-Host "Production HEALTH CHECK"
                      Write-Host "========================================"

                      Write-Host "Server: $env:COMPUTERNAME"
                      Write-Host "Port: $Port"

                      while ($attempt -le $maxAttempts -and -not $success) {
                        try {
                          Write-Host "Health check attempt $attempt/$maxAttempts..."

                          $response = Invoke-WebRequest -Uri "http://localhost:$Port/api/health" -UseBasicParsing -TimeoutSec 10

                          if ($response.StatusCode -eq 200) {
                            Write-Host "Health check passed!"
                            Write-Host "Status: $($response.StatusCode)"

                            $success = $true
                          }
                        } catch {
                          Write-Host "Attempt $attempt failed:"
                          Write-Host $_.Exception.Message
                        }
                        if (-not $success) {
                          if ($attempt -lt $maxAttempts) {
                            Write-Host "Waiting 5 seconds..."
                            Start-Sleep -Seconds 5
                          }

                          $attempt++
                        }
                      }
                
                      if (-not $success) {
                        Write-Host ""
                        Write-Host "PM2 status:"
                        pm2 list

                        throw "Production deployment health check failed."
                      }

                      Write-Host "========================================"
                      Write-Host "PRODUCTION HEALTH CHECK PASSED"
                      Write-Host "========================================"