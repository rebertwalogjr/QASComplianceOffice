trigger:
  branches:
    include:
      - dev
      - main

variables:
  - group: 'qasco-app-variable'
  - name: buildConfiguration
    value: 'Release'
  - name: nodeVersion
    value: '22'
  - name: appName
    value: 'qasco'

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
    - job: Build
      displayName: 'Build and Test'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - task: UseNode@1
          inputs:
            version: '$(nodeVersion)'
          displayName: 'Install Node.js'

        - script: |
            npm ci
          displayName: 'Install dependencies'

        - script: |
            npm run build
          displayName: 'Build Next.js app'

        - script: |
            npm run test
          displayName: 'Run tests'
          continueOnError: true

        - task: CopyFiles@2
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)'
            Contents: |
              .next/**
              public/**
              node_modules/**
              package.json
              package-lock.json
              ecosystem.config.js
              server.js
              deploy-scripts/**
            TargetFolder: '$(Build.ArtifactStagingDirectory)/standalone'
            OverWrite: true
          displayName: 'Prepare standalone build'

        - script: |
            echo "NODE_ENV=production" > $(Build.ArtifactStagingDirectory)/standalone/.env.template
            echo "PORT=3000" >> $(Build.ArtifactStagingDirectory)/standalone/.env.template
            echo "# Add environment-specific variables below" >> $(Build.ArtifactStagingDirectory)/standalone/.env.template
          displayName: 'Create environment template'

        - script: |
            echo $(Build.SourceBranchName) > $(Build.ArtifactStagingDirectory)/standalone/BUILD_BRANCH.txt
            echo $(Build.BuildId) >> $(Build.ArtifactStagingDirectory)/standalone/BUILD_BRANCH.txt
            echo $(Build.SourceVersion) >> $(Build.ArtifactStagingDirectory)/standalone/BUILD_BRANCH.txt
          displayName: 'Store build metadata'

        # - task: ArchiveFiles@2
        #   inputs:
        #     rootFolderOrFile: '$(Build.BinariesDirectory)'
        #     includeRootFolder: false
        #     archiveType: 'zip'
        #     archiveFile: '$(Build.ArtifactStagingDirectory)/$(appName)-$(Build.BuildId).zip'
        #     replaceExistingArchive: true
        #   displayName: 'Create build artifact'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/standalone'
            ArtifactName: 'nextjs-app'
            publishLocation: 'Container'
          displayName: 'Publish build artifact'

  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Dev Windows Server'
        # environment: 'DEV'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters:
                    Environment: 'Development'
                    EnvironmentShort: 'dev'
                    AppName: $(appName)
                    ServerVariable: 'DevServer'
                    PathVariable: 'DevPath'
                    UserVariable: 'DevUser'
                    PasswordVariable: 'DevPassword'
                    Port: 3001
                    HealthCheckUrl: 'http://localhost:3001/api/health'
                # - task: DownloadBuildArtifacts@1
                #   inputs:
                #     buildType: 'current'
                #     downloadType: 'single'
                #     artifactName: 'drop'
                #     downloadPath: '$(System.ArtifactsDirectory)'
                #   displayName: 'Download build artifacts'

  - stage: Deploy_Prod
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Prod Windows Server'
        environment: 'PROD'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters:
                    Environment: 'Production'
                    EnvironmentShort: 'prod'
                    AppName: $(appName)
                    ServerVariable: 'ProdServer'
                    PathVariable: 'ProdPath'
                    UserVariable: 'ProdUser'
                    PasswordVariable: 'ProdPassword'
                    Port: 3000
                    HealthCheckUrl: 'http://localhost:3000/api/health'
                # - task: DownloadBuildArtifacts@1
                #   inputs:
                #     buildType: 'current'
                #     downloadType: 'single'
                #     artifactName: 'drop'
                #     downloadPath: '$(System.ArtifactsDirectory)'
                #   displayName: 'Download build artifacts'

                