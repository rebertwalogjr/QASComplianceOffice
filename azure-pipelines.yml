trigger:
  branches:
    include:
      - dev
      - main

variables:
  - name: nodeVersion
    value: '22'
  - name: appName
    value: 'qasco'

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
    - job: Build
      displayName: 'Build and Test'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - task: UseNode@1
          inputs:
            version: '$(nodeVersion)'
          displayName: 'Install Node.js'

        - script: |
            npm ci
          displayName: 'Install dependencies'

        - script: |
            npm run build
          displayName: 'Build Next.js app'

        # - script: |
        #     npm run test
        #   displayName: 'Run tests'
        #   continueOnError: true

        - task: CopyFiles@2
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)'
            Contents: |
              .next/**
              public/**
              package.json
              package-lock.json
              ecosystem.config.js
              server.js
              deploy-scripts/**
            TargetFolder: '$(Build.ArtifactStagingDirectory)/standalone'
            OverWrite: true
          displayName: 'Prepare standalone build'

        - script: |
            echo "NODE_ENV=production" > $(Build.ArtifactStagingDirectory)/standalone/.env.template
            echo "PORT=3000" >> $(Build.ArtifactStagingDirectory)/standalone/.env.template
            echo "# Add environment-specific variables below" >> $(Build.ArtifactStagingDirectory)/standalone/.env.template
          displayName: 'Create environment template'

        - script: |
            echo $(Build.SourceBranchName) > $(Build.ArtifactStagingDirectory)/standalone/BRANCH.txt
          displayName: 'Store branch info'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/standalone'
            includeRootFolder: true
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
            replaceExistingArchive: true
          displayName: 'Compress files into a zip'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
            ArtifactName: 'drop'
            publishLocation: 'Container'
          displayName: 'Publish build artifact'

  - stage: Deploy_UAT
    displayName: 'Deploy to UAT'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      - group: 'qasco-uat-variables'
    jobs:
      - deployment: DeployToUAT
        displayName: 'Deploy to UAT Windows Server'
        environment:
          name: uat
          resourceName: UAT_QASCO
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                # ==================================================
                # UAT Agent diagnostics
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify Target Machine'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "========================================"
                      Write-Host "UAT Agent Diagnostics"
                      Write-Host "========================================"

                      Write-Host "Agent OS: $(Agent.OS)"
                      Write-Host "Agent Name: $(Agent.Name)"
                      Write-Host "Computer Name:"
                      hostname

                      Write-Host ""
                      Write-Host "PowerShell:"
                      $PSVersionTable

                      Write-Host ""
                      Write-Host "Node:"
                      node --version

                      Write-Host ""
                      Write-Host "NPM:"
                      npm --version

                      Write-Host ""
                      Write-Host "PM2:"
                      pm2 --version

                # ==================================================
                # Download artifacts
                # ==================================================
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifact'

                # ==================================================
                # Extract artifacts
                # ==================================================
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(System.ArtifactsDirectory)/drop/*.zip'
                    destinationFolder: '$(System.ArtifactsDirectory)/extracted'
                    cleanDestinationFolder: true
                  displayName: 'Extract build artifact'

                # ==================================================
                # Deploy to UAT Server
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Deploy to UAT Windows Server'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      # ------------------------------------------------
                      # Configuration
                      # ------------------------------------------------
                      $DeploymentPath = '$(Path)'
                      $AppName = '$(appName)'
                      $Environment = 'uat'
                      $Port = '$(Port)'

                      $SourcePath = "$(System.ArtifactsDirectory)/extracted"
                      $AppPath = Join-Path $DeploymentPath $AppName
                      $Pm2AppName = "$AppName-$Environment"

                      Write-Host "========================================"
                      Write-Host "UAT DEPLOYMENT"
                      Write-Host "========================================"
                      Write-Host "Computer : $env:COMPUTERNAME"
                      Write-Host "App Name : $AppName"
                      Write-Host "PM2 Name : $Pm2AppName"
                      Write-Host "Environment : $Environment"
                      Write-Host "Port : $Port"
                      Write-Host "Source : $SourcePath"
                      Write-Host "Destination : $AppPath"
                      Write-Host "========================================"
                      
                      # ------------------------------------------------
                      # Validate source
                      # ------------------------------------------------
                      if (-not (Test-Path $SourcePath)) {
                        throw "Source path does not exist: $SourcePath"
                      }

                      # ------------------------------------------------
                      # Stop existing application
                      # ------------------------------------------------
                      Write-Host "Stopping existing PM2 application..."

                      pm2 delete $Pm2AppName 2>$null

                      # ------------------------------------------------
                      # Create application directory
                      # ------------------------------------------------
                      Write-Host "Creating application directory..."

                      New-Item -ItemType Directory -Path $AppPath -Force | Out-Null

                      # ------------------------------------------------
                      # Copy application files
                      # ------------------------------------------------
                      Write-Host "Copying application files..."

                      Copy-Item -Path "$SourcePath/*" -Destination $AppPath -Recurse -Force

                      Write-Host "Files copied successfully."

                      # ------------------------------------------------
                      # Validate application
                      # ------------------------------------------------
                      if (-not (Test-Path "$AppPath\package.json")) {
                        throw "package.json not found at $AppPath"
                      }

                      if (-not (Test-Path "$AppPath\.env.template")) {
                        throw ".env.template not found at $AppPath"
                      }

                       # ------------------------------------------------
                      # Move to application directory
                      # ------------------------------------------------
                      Set-Location $AppPath

                      # ------------------------------------------------
                      # Install production dependencies
                      # ------------------------------------------------
                      Write-Host "Installing production dependencies..."

                      npm ci --production --no-fund --no-audit

                      if ($LASTEXITCODE -ne 0) {
                        throw "npm ci failed with exit code $LASTEXITCODE"
                      }

                      # ------------------------------------------------
                      # Create .env.uat
                      # ------------------------------------------------
                      Write-Host "Creating .env.$Environment..."

                      $envFile = Join-Path $AppPath ".env.$Environment"

                      if (-not (Test-Path "$AppPath\.env.template")) {
                        throw ".env.template was not found at $AppPath"
                      }

                      Copy-Item "$AppPath\.env.template" $envFile -Force

                      Add-Content $envFile ""
                      Add-Content $envFile "# $Environment Environment Variables"
                      Add-Content $envFile "DATABASE_URL=$DB_URL"
                      Add-Content $envFile "DB_HOST=$DB_HOST"
                      Add-Content $envFile "DB_NAME=$DB_NAME"
                      Add-Content $envFile "DB_PASSWORD=$DB_PASSWORD"
                      Add-Content $envFile "DB_PORT=$DB_PORT"
                      Add-Content $envFile "DB_USER=$DB_USER"
                      Add-Content $envFile "FILE_SERVER_PATH=$FILE_PATH"
                      Add-Content $envFile "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
                      Add-Content $envFile "NEXTAUTH_URL=$NEXTAUTH_URL"
                      Add-Content $envFile "PORT=$Port"
                      Add-Content $envFile "APP_ENVIRONMENT=$Environment"

                      Write-Host ".env.$Environment created."

                      # ------------------------------------------------
                      # Create logs directory
                      # ------------------------------------------------
                      $LogsPath = Join-Path $AppPath "logs"
                      New-Item -ItemType Directory -Path $LogsPath -Force | Out-Null

                      # ------------------------------------------------
                      # Create PM2 ecosystem configuration
                      # ------------------------------------------------
                      Write-Host "Creating ecosystem.config.js..."

                      $config = @(
                        "module.exports = {"
                        " apps: [{"
                        " name: '$Pm2AppName',"
                        " script: 'node_modules/next/dist/bin/next',"
                        " args: 'start',"
                        " env_${Environment}: {"
                        "   NODE_ENV: 'production',"
                        "   PORT: $Port"
                        " },"
                        " watch: false,"
                        " autorestart: true,"
                        " max_memory_restart: '1G',"
                        " error_file: '$AppPath/logs/pm2-error.log',"
                        " out_file: '$AppPath/logs/pm2-out.log',"
                        " instances: 'max',"
                        " exec_mode: 'cluster'"
                        " }]"
                        "}"
                      ) -join [Environment]::NewLine

                      Set-Content -Path "$AppPath\ecosystem.config.js" -Value $config -Encoding UTF8
                      Write-Host "ecosystem.config.js created."

                      # ------------------------------------------------
                      # Start PM2
                      # ------------------------------------------------
                      Write-Host "Starting PM2 application..."

                      pm2 start ecosystem.config.js --env $Environment

                      if ($LASTEXITCODE -ne 0) {
                        throw "PM2 start failed with exit code $LASTEXITCODE"
                      }

                      Write-Host "Saving PM2 process list..."

                      pm2 save

                      Write-Host "PM2 status:"

                      pm2 list

                      Write-Host ""
                      Write-Host "========================================"
                      Write-Host "UAT DEPLOYMENT COMPLETED"
                      Write-Host "========================================"
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                    DB_HOST: $(DB_HOST)
                    DB_NAME: $(DB_NAME)
                    DB_PASSWORD: $(DB_PASSWORD)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    FILE_SERVER_PATH: $(FILE_SERVER_PATH)
                    NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
                    NEXTAUTH_URL: $(NEXTAUTH_URL)

                # ==================================================
                # Health Check
                # ==================================================
                - task: PowerShell@2
                  displayName: 'Verify UAT deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $ErrorActionPreference = 'Stop'

                      $Port = $(Port)
                      $maxAttempts = 12
                      $attempt = 1
                      $success = $false

                      Write-Host "========================================"
                      Write-Host "UAT HEALTH CHECK"
                      Write-Host "========================================"

                      Write-Host "Server: $env:COMPUTERNAME"
                      Write-Host "Port: $Port"

                      while ($attempt -le $maxAttempts -and -not $success) {
                        try {
                          Write-Host "Health check attempt $attempt/$maxAttempts..."

                          $response = Invoke-WebRequest -Uri "http://localhost:$Port/api/health" -UseBasicParsing -TimeoutSec 10

                          if ($response.StatusCode -eq 200) {
                            Write-Host "Health check passed!"
                            Write-Host "Status: $($response.StatusCode)"

                            $success = $true
                          }
                        } catch {
                          Write-Host "Attempt $attempt failed:"
                          Write-Host $_.Exception.Message
                        }
                        if (-not $success) {
                          if ($attempt -lt $maxAttempts) {
                            Write-Host "Waiting 5 seconds..."
                            Start-Sleep -Seconds 5
                          }

                          $attempt++
                        }
                      }
                
                      if (-not $success) {
                        Write-Host ""
                        Write-Host "PM2 status:"
                        pm2 list

                        throw "UAT deployment health check failed."
                      }

                      Write-Host "========================================"
                      Write-Host "UAT HEALTH CHECK PASSED"
                      Write-Host "========================================"


  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'qasco-prod-variables'
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Prod Windows Server'
        # pool:
        #   vmImage: 'windows-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # Download artifacts
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifact'

                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: '$(System.ArtifactsDirectory)/drop/*.zip'
                    destinationFolder: '$(System.ArtifactsDirectory)/extracted'
                    cleanDestinationFolder: true
                  displayName: 'Extract build artifact'

                # Deploy to production Server
                - task: PowerShell@2
                  displayName: 'Deploy to Production Windows Server'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $Server = '$(Server)'
                      $User = '$(User)'
                      $Password = '$(Password)'
                      $DeploymentPath = '$(Path)'
                      $AppName = '$(appName)'
                      $Environment = 'prod'
                      $Port = '$(Port)'
                      $SourcePath = "$(System.ArtifactsDirectory)/extracted"
                      
                      Write-Host "Deploying to Production Server: $Server"
                      Write-Host "WARNING: This is PRODUCTION deployment!"

                      # Create session
                      $securePass = ConvertTo-SecureString $Password -AsPlainText -Force
                      $cred = New-Object System.Management.Automation.PSCredential($User, $securePass)
                      $session = New-PSSession -ComputerName $Server -Credential $cred -ErrorAction Stop

                      try {
                        $AppPath = "$DeploymentPath\$AppName"

                        # Create backup
                        Invoke-Command -Session $session -ScriptBlock {
                          param($AppPath)
                          if (Test-Path $AppPath) {
                            $BackupPath = "$AppPath\..\backups\$AppName-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
                            New-Item -ItemType Directory -Path $BackupPath -Force | Out-Null
                            Copy-Item -Path "$AppPath\*" -Destination $BackupPath -Recurse -Force
                            Write-Host "Backup created at: $BackupPath"
                          }
                        } -ArgumentList $AppPath

                        # Create destination directory
                        Invoke-Command -Session $session -ScriptBlock {
                          param($AppPath)
                          New-Item -ItemType Directory -Path $AppPath -Force | Out-Null
                        } -ArgumentList $AppPath

                        # Copy files to remote server
                        Write-Host "Copying files to $Server..."
                        Copy-Item -Path "$SourcePath/*" -Destination $AppPath -ToSession $session -Recurse -Force

                        # Remote work transaction on Windows Server

                        Invoke-Command -Session $session -ScriptBlock {
                          param($AppPath, $AppName, $Environment, $Port, $DB_URL, $DB_HOST, $DB_NAME, $DB_PASSWORD, $DB_PORT, $DB_USER, $FILE_PATH, $NEXTAUTH_SECRET, $NEXTAUTH_URL)
                          
                          Set-Location $AppPath
                          
                          # 1. Install dependencies
                          Write-Host "Installing dependencies..."
                          npm ci --production --no-fund --no-audit
                          
                          # 2. Create .env file on the server
                          Write-Host "Creating .env.$Environment file..."
                          $envFile = "$AppPath\.env.$Environment"
                          Copy-Item "$AppPath\.env.template" $envFile
                          Add-Content $envFile "`n# $Environment Environment Variables"
                          Add-Content $envFile "DATABASE_URL=$DB_URL"
                          Add-Content $envFile "DB_HOST=$DB_HOST"
                          Add-Content $envFile "DB_NAME=$DB_NAME"
                          Add-Content $envFile "DB_PASSWORD=$DB_PASSWORD"
                          Add-Content $envFile "DB_PORT=$DB_PORT"
                          Add-Content $envFile "DB_USER=$DB_USER"
                          Add-Content $envFile "FILE_SERVER_PATH=$FILE_PATH"
                          Add-Content $envFile "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
                          Add-Content $envFile "NEXTAUTH_URL=$NEXTAUTH_URL"
                          Add-Content $envFile "PORT=$Port"
                          Add-Content $envFile "APP_ENVIRONMENT=$Environment"
                          Write-Host "Created .env file on server"
                          
                          # 3. Stop PM2
                          Write-Host "Stopping PM2 process..."
                          pm2 delete $AppName 2>$null
                          
                          # 4. Create ecosystem config
                          Write-Host "Creating ecosystem.config.js..."
                          New-Item -ItemType Directory -Path "$AppPath\logs" -Force | Out-Null
                          
                          $config = @"
                            module.exports = {
                            apps: [{
                              name: '$AppName-$Environment',
                              script: 'node_modules/next/dist/bin/next',
                              args: 'start',
                              env_$Environment: {
                                NODE_ENV: 'production',
                                PORT: $Port
                              },
                              watch: false,
                              autorestart: true,
                              max_memory_restart: '1G',
                              error_file: '$AppPath/logs/pm2-error.log',
                              out_file: '$AppPath/logs/pm2-out.log',
                              instances: 'max',
                              exec_mode: 'cluster',
                              kill_timeout: 5000,
                              listen_timeout: 3000,
                              wait_ready: true
                            }]
                          }
                          "@

                          Set-Content -Path "$AppPath\ecosystem.config.js" -Value $config
                          
                          # 5. Start PM2
                          Write-Host "Starting PM2..."
                          pm2 start ecosystem.config.js --env $Environment
                          pm2 save
                          pm2 list
                          
                          Write-Host "Deployment completed on server!"
                          
                        } -ArgumentList $AppPath, $AppName, $Environment, $Port, `
                          $(DATABASE_URL), $(DB_HOST), $(DB_NAME), $(DB_PASSWORD), $(DB_PORT), $(DB_USER), `
                          $(FILE_SERVER_PATH), $(NEXTAUTH_SECRET), $(NEXTAUTH_URL)
                      
                      } finally {
                        Remove-PSSession $session
                      }

                      Write-Host "Production Deployment completed!"

                - task: PowerShell@2
                  displayName: 'Verify Production deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $Server = '$(Server)'
                      $Port = $(Port)
                      $maxAttempts = 15
                      $attempt = 1
                      $success = $false

                      while ($attempt -le $maxAttempts -and -not $success) {
                        try {
                          $response = Invoke-WebRequest -Uri "http://$Server`:$Port/api/health" -UseBasicParsing -TimeoutSec 10
                          if ($response.StatusCode -eq 200) {
                            Write-Host "Health check passed!"
                            $success = $true
                          }
                        } catch {
                          Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
                        }
                        if (-not $success) {
                          Start-Sleep -Seconds 5
                          $attempt++
                        }
                      }
                
                      if (-not $success) {
                        throw "Production deployment verification failed"
                      }